# Reusable: Postgres service + Python setup once; callers pass only the test paths.
name: Python tests (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Job name shown in the Actions UI
        type: string
        default: pytest
      tests:
        description: Space-separated test paths/globs (shell-expanded)
        type: string
        required: true

jobs:
  pytest:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cp .env.example .env && python scripts/db_setup.py
      - run: pytest -q -rs ${{ inputs.tests }}
