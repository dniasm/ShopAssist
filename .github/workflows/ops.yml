name: "Ops · Tooling"

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: "Ops tests"
      tests: tests/test_run_all.py tests/test_order_migrations.py

  coverage-guard:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python scripts/ci_test_coverage.py
