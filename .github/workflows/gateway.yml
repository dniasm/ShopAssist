name: "Gateway · API"
run-name: "Gateway · API · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: "Gateway tests"
      tests: tests/test_api*.py tests/test_events_hub.py tests/test_common.py
