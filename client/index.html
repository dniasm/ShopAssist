<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopAssist</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
    input[type=text] { flex: 1 1 320px; padding: .5rem; font-size: 1rem; }
    input[type=url] { flex: 1 1 220px; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #status { margin: .5rem 0 1rem; color: #555; min-height: 1.2em; }
    #events { list-style: none; padding: 0; margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; }
    #events li { border-bottom: 1px solid #eee; padding: .35rem 0; word-break: break-word; }
    #events .type { display: inline-block; min-width: 9rem; font-weight: bold; }
    #events .final_answer { color: #0a6b2d; }
    #events .error { color: #b00020; }
    #answer { margin: 0 0 1rem; padding: .75rem 1rem; border-radius: 6px; font-size: 1.05rem; line-height: 1.4; background: #eef7f0; border: 1px solid #b9dfc4; color: #0a3d1a; white-space: pre-wrap; }
    #answer.error { background: #fdecee; border-color: #f2b8c0; color: #8a1024; }
    #answer[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>ShopAssist</h1>

  <form id="ask-form">
    <input type="text" id="query" placeholder="Ask about an order, product or stock…" autocomplete="off" required>
    <button type="submit" id="send">Send</button>
  </form>
  <form id="base-form">
    <label for="base">Orchestrator URL:</label>
    <input type="url" id="base" value="http://localhost:8000">
  </form>

  <div id="status"></div>
  <div id="answer" hidden></div>
  <ul id="events"></ul>

  <script>
    (function () {
      var form = document.getElementById("ask-form");
      var queryBox = document.getElementById("query");
      var baseBox = document.getElementById("base");
      var sendBtn = document.getElementById("send");
      var statusEl = document.getElementById("status");
      var list = document.getElementById("events");
      var answerEl = document.getElementById("answer");
      var socket = null;

      function setStatus(text) { statusEl.textContent = text; }

      function clearAnswer() {
        answerEl.textContent = "";
        answerEl.className = "";
        answerEl.hidden = true;
      }

      function showAnswer(text, isError) {
        answerEl.textContent = text;
        answerEl.className = isError ? "error" : "";
        answerEl.hidden = false;
      }

      function appendEvent(event) {
        var li = document.createElement("li");
        var type = document.createElement("span");
        type.className = "type " + event.type;
        type.textContent = event.type;
        li.appendChild(type);
        li.appendChild(document.createTextNode(" " + JSON.stringify(event.data || event.message || {})));
        list.appendChild(li);
      }

      function toWsBase(httpBase) {
        return httpBase.replace(/\/+$/, "").replace(/^https:/, "wss:").replace(/^http:/, "ws:");
      }

      function closeSocket() {
        if (socket) { socket.close(); socket = null; }
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var text = queryBox.value.trim();
        if (!text) { return; }
        var base = baseBox.value.trim().replace(/\/+$/, "");

        closeSocket();
        list.innerHTML = "";
        clearAnswer();
        setStatus("Sending…");
        sendBtn.disabled = true;

        fetch(base + "/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        })
          .then(function (res) {
            if (!res.ok) { throw new Error("POST /query failed: HTTP " + res.status); }
            return res.json();
          })
          .then(function (body) {
            setStatus("Query " + body.query_id + " accepted. Streaming…");
            socket = new WebSocket(toWsBase(base) + body.ws_url);
            socket.onmessage = function (msg) {
              var event = JSON.parse(msg.data);
              appendEvent(event);
              if (event.type === "final_answer") {
                showAnswer((event.data && event.data.answer) || "(no answer)", false);
              }
              if (event.type === "error") {
                showAnswer((event.data && event.data.message) || "Something went wrong.", true);
              }
              if (event.type === "final_answer" || event.type === "error") {
                setStatus(event.type === "final_answer" ? "Done." : "Finished with an error.");
                sendBtn.disabled = false;
                closeSocket();
              }
            };
            socket.onerror = function () {
              setStatus("WebSocket error. Is the orchestrator running?");
              sendBtn.disabled = false;
            };
            socket.onclose = function () {
              sendBtn.disabled = false;
            };
          })
          .catch(function (err) {
            setStatus(err.message + ". Is the orchestrator running at " + base + "?");
            sendBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
