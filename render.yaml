# Render Blueprint: one Docker web service (orchestrator + six gRPC services in one container) + one free Postgres.
# Secrets you must enter in the dashboard (sync: false): LLM_API_KEYS, VOYAGE_API_KEY, SIGNUP_CODE (optional).
services:
  - type: web
    name: shopassist
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/render_start.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopassist-db
          property: connectionString
      - key: SVC_KEY_ORCHESTRATOR
        generateValue: true
      - key: SVC_KEY_ORDER
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_API_KEYS
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: SIGNUP_CODE
        sync: false

databases:
  - name: shopassist-db
    plan: free
