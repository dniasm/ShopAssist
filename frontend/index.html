<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Assistant · ShopAssist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5.5 8h13l-1 11.5a1.5 1.5 0 0 1-1.5 1.4H8a1.5 1.5 0 0 1-1.5-1.4z' fill='none' stroke='%2311110f' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M9 8V7a3 3 0 0 1 6 0v1' fill='none' stroke='%2311110f' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='15' r='1.4' fill='%231d5fbf'/%3E%3Ccircle cx='15' cy='15' r='1.4' fill='%231d5fbf'/%3E%3Cpath d='M10.4 15h3.2' stroke='%231d5fbf' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <a class="skip-link" href="#query">Skip to the question box</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="ShopAssist, Assistant">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="bag" d="M5.5 8h13l-1 11.5a1.5 1.5 0 0 1-1.5 1.4H8a1.5 1.5 0 0 1-1.5-1.4z"></path>
          <path class="bag" d="M9 8V7a3 3 0 0 1 6 0v1"></path>
          <circle class="hop" cx="9" cy="15" r="1.4"></circle><circle class="hop" cx="15" cy="15" r="1.4"></circle>
          <path class="link" d="M10.4 15h3.2"></path>
        </svg>
        <span class="brand-name">ShopAssist</span>
      </a>
      <nav class="nav" aria-label="Pages">
        <a href="index.html" aria-current="page">Assistant</a>
        <a href="system.html">System</a>
      </nav>
      <a class="readout" id="readout" href="system.html" data-state="checking" aria-label="System status, open the System page">
        <span class="dot" aria-hidden="true"></span><span class="readout-text" id="readout-text">Checking&hellip;</span>
      </a>
    </div>
  </header>

  <main class="canvas" id="main">
    <div class="title-row">
      <div>
        <h1>Assistant</h1>
        <p class="sub">Orders, products and stock, answered by the store&rsquo;s three services.</p>
      </div>
    </div>

    <div class="assistant">
      <section class="chat" aria-label="Conversation">
        <div class="thread" id="thread">
          <section class="reply ghost" id="empty" aria-label="No questions yet">
            <div class="ghost-route"></div>
            <div class="answer ghost-answer">
              <p class="empty-title">No questions yet</p>
              <p class="muted">Ask below. Each answer arrives with the route it took, drawn as it happens.</p>
              <div class="empty-questions"></div>
            </div>
          </section>
        </div>

        <div class="composer-bar">
          <form class="composer" id="composer" autocomplete="off">
            <label class="sr-only" for="query">Your question</label>
            <input id="query" name="query" type="text" maxlength="500" enterkeyhint="send"
                   placeholder="Ask about an order, a product or its stock">
            <button class="btn primary" type="submit">Ask</button>
          </form>
        </div>
      </section>

      <aside class="rail" aria-labelledby="rail-title">
        <h2 id="rail-title">Questions to try</h2>
        <ul class="questions" id="questions"></ul>
        <a class="rail-link" href="system.html">How the answers are routed</a>
      </aside>
    </div>
  </main>

  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="empty">ShopAssist needs JavaScript to talk to the backend.</p></noscript>
  <script type="module" src="js/assistant.js"></script>
</body>
</html>
